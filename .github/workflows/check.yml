name: VPN Gate Node Check

on:
  # 定时检测: 每 30 分钟一次。改成每 60 分钟: cron: "0 * * * *"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 版本号用「精确 tag」而不是 @v4 这种浮动大版本:
      #   - 浮动 tag 会被上游悄悄改指向, 属于供应链风险
      #   - 精确 tag 行为可复现, 出问题好定位
      #   - 全部已升级到 node24 运行时, 消除 Node20 弃用告警
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --disable-pip-version-check --no-input -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
            # 改成你自己的 Worker 域名
          CHECK_WORKER: "https://eris.terminator-sky.net/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"

          # --- edgetunnel 订阅配置 (生成 chains.txt / hosts.txt / sub.txt 用) ---
          # EDT_UUID 必须和你的 Worker 实际使用的 UUID 完全一致, 否则客户端连不上。
          # 取值来源 (二选一):
          #   a) Worker 变量里显式设了 UUID      -> 填那个值
          #   b) Worker 没设 UUID (由 ADMIN+KEY 推导) -> 用仓库里的 get_edt_uuid.py 算
          #      python get_edt_uuid.py <你的ADMIN> <你的KEY>
          # 启用步骤:
          #   1) Settings -> Secrets and variables -> Actions -> New secret, 名为 EDT_UUID
          #   2) 去掉下面这行行首的 "# " (不建 Secret 就直接启用, 脚本会因为拿到空串而报错停止)
          # EDT_UUID: ${{ secrets.EDT_UUID }}
          #
          # 下面两个有默认值, 显式写出来只是为了让你知道在哪改:
          EDT_DOMAIN: "discordia.terminator-sky.net"
          EDT_FINGERPRINT: "chrome"

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
        with:
          # 仓库还没开 Pages 时自动开启（比手写 curl 调 API 可靠）
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1

      - name: Show site URL
        run: 'echo "site: https://MinerBin.github.io/Eris/ (deploy outcome: ${{ steps.deployment.outcome }})"'
